[package]
name = "norrust_core"
version = "0.1.0"
edition = "2021"

[lib]
crate-type = ["cdylib", "rlib"]

[[bin]]
name = "self-play"
path = "src/bin/self_play.rs"

[[bin]]
name = "greedy_driver"
path = "src/bin/greedy_driver.rs"

[[bin]]
name = "history_eval"
path = "src/bin/history_eval.rs"

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
toml = "0.8"
thiserror = "2"
sha2 = "0.10"
rusqlite = { version = "0.31", features = ["bundled"] }

[profile.release]
panic = "abort"

[profile.dev]
panic = "abort"

# Integration tests use Cargo's unwind-based test harness even though the
# production/debug library is built with abort semantics.
[profile.test]
panic = "unwind"
