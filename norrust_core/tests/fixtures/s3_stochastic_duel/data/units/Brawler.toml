# TEST-ONLY unit fixture for the S3 bounded-rollout evaluation-seed tests.
# 16 strikes at 1 damage each, paired with a terrain that gives exactly 50%
# hit chance (see ../terrain/keep.toml), makes total damage per full attack
# a binomial(16, 0.5) outcome: anywhere from 0 to 16, distinct seeds landing
# on different totals with overwhelming probability. max_hp is comfortably
# above the worst case (16) so neither side ever dies mid-test, which keeps
# both the candidate's own attack and the opponent's counter-response
# available for every seed exercised by these tests.
