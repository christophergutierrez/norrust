[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "norrust-tools"
version = "0.1.0"
description = "Developer and evaluation tools for The Clash for Norrust"
requires-python = ">=3.11"

[project.optional-dependencies]
assets = ["Pillow>=10"]

[tool.setuptools.packages.find]
include = ["tools*"]
